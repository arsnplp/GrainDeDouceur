# ============================================================
# nginx.seo.conf — Grain de Douceur
# À inclure dans le bloc server{} du vhost nginx existant :
#   include /chemin/vers/nginx.seo.conf;
# Domaine canonique : https://graindedouceur.fr (sans www)
# ============================================================

# ── 1. REDIRECTION www → non-www (301 permanente) ──────────
# Ce bloc REMPLACE le server{} www existant (ou l'ajouter en parallèle)
server {
    listen 80;
    listen 443 ssl;
    server_name www.graindedouceur.fr;
    # (les directives ssl_certificate/ssl_certificate_key restent dans
    #  la config SSL principale, ne pas les dupliquer ici)
    return 301 https://graindedouceur.fr$request_uri;
}

# ── 2. REDIRECTION HTTP → HTTPS (si pas déjà géré) ─────────
server {
    listen 80;
    server_name graindedouceur.fr;
    return 301 https://graindedouceur.fr$request_uri;
}

# ── 3. REDIRECTION ancienne URL épilation → nouvelle ───────
# À placer dans le server{} principal (https://graindedouceur.fr)
location = /epilations-cire-jetableepilation-definitive-lumiere-pulsee.html {
    return 301 /epilation-cire-et-definitive.html;
}

# ── 4. COMPRESSION gzip ────────────────────────────────────
# (Brotli nécessite le module ngx_brotli — si disponible, décommenter)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/html
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

# Brotli (décommenter si ngx_brotli est compilé) :
# brotli on;
# brotli_comp_level 6;
# brotli_types text/html text/css text/javascript application/javascript application/json image/svg+xml;

# ── 5. CACHE-CONTROL ───────────────────────────────────────
# Assets statiques immuables (fingerprint non utilisé → max-age 1 an avec must-revalidate)
location ~* \.(webp|avif|jpg|jpeg|png|gif|ico|svg|woff2|woff)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
}

location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
}

# Pages HTML : revalidation côté serveur toutes les heures
location ~* \.html$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Vary "Accept-Encoding";
}

# sitemap.xml et robots.txt : cache court
location ~* (sitemap\.xml|robots\.txt)$ {
    add_header Cache-Control "public, max-age=86400";
}

# ── 6. EN-TÊTES DE SÉCURITÉ (bonus SEO / Best Practices) ──
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── NOTES D'APPLICATION ────────────────────────────────────
# 1. Tester la config avant rechargement :
#    nginx -t
# 2. Recharger nginx (sans coupure) :
#    systemctl reload nginx
# 3. Vérifier la compression active :
#    curl -sI -H "Accept-Encoding: gzip" https://graindedouceur.fr/ | grep content-encoding
# 4. Après déploiement, soumettre le sitemap dans Google Search Console :
#    https://graindedouceur.fr/sitemap.xml
